const svg=`<svg viewBox="0 0 ${M.W} ${M.H}" style="filter:drop-shadow(0 0 14px #ff7a0044)">${dv.map(d=>`<path ${at("Division",d.n)} d="${M.div[d.n].d}" fill="${ramp((d[m]-mn)/(mx-mn||1),bad)}" stroke="${isSel("Division",d.n)?Y:"#05060A"}" stroke-width="${isSel("Division",d.n)?3.5:2}" opacity="${sv&&!isSel("Division",d.n)?.4:1}"><title>${d.n}: ${f(d[m])}</title></path>`).join("")}${dv.map(d=>{const p=M.div[d.n];return`<text x="${p.x}" y="${p.y}" text-anchor="middle" fill="#fff" font-size="11" font-weight="600" style="paint-order:stroke;pointer-events:none" stroke="#000" stroke-width="3">${d.n}</text><text x="${p.x}" y="${p.y+13}" text-anchor="middle" fill="${Y}" font-size="12" font-weight="800" style="paint-order:stroke;pointer-events:none" stroke="#000" stroke-width="3">${f(d[m])}</text>`}).join("")}</svg>`;
const rk=Object.entries(Object.fromEntries(dv.map(d=>[d.n,d[m]]))).sort((a,b)=>b[1]-a[1]);
return`<div class="ch">${MET.map((x,i)=>`<button class="${i==cm?"on":""}" ${at("MAPM",i)}>${x[1]}</button>`).join("")}</div><div class="mp">${svg}<div>${barsC(rk,bad?R:Y,"Division")}<div class="ft">Click a division to filter every page. Dark = low, bright = high. Population & area approx. (2022 census).</div></div></div>`}
const tbl=dv=>{const cs=[["subs","Subs",0],["pd","Pop dens.",0],["sd","Sub dens.",0],["td","Tower dens.",0],["churn","Churn %",1],["arpu","ARPU ৳",0],["drop","Drop %",1],["avail","Avail %",0],["csat","CSAT",0]],st=cs.map(([k])=>{const v=dv.map(d=>d[k]);return[Math.min(...v),Math.max(...v)]});
return`<table><tr><th>Division</th>${cs.map(c=>`<th>${c[1]}</th>`).join("")}</tr>${dv.map(d=>`<tr ${at("Division",d.n)} class="${dmC("Division",d.n)}"><td><b>${d.n}</b></td>${cs.map(([k,,b],i)=>`<td style="background:${ramp((d[k]-st[i][0])/(st[i][1]-st[i][0]||1)*.85,b)}55">${f(d[k])}</td>`).join("")}</tr>`).join("")}</table>`};
const INS=dv=>{const mx=(k)=>dv.reduce((a,b)=>b[k]>a[k]?b:a),w=mx("drop"),h=mx("sd"),c=mx("churn"),ci=Object.entries(G("tick","Issue")).map(([k,s])=>[k,sf(MS.chtk,s)]).sort((a,b)=>b[1]-a[1])[0],ar=Object.entries(G("usage","Network")).map(([k,s])=>[k,sf(MS.arpu,s)]).sort((a,b)=>b[1]-a[1])[0];
return[`${w.n} has the highest call drop (${w.drop.toFixed(2)}%): prioritise tower upgrades.`,`${h.n} is the densest division (${h.sd.toFixed(1)} subs per 100 km²).`,`${c.n} has the highest churn (${c.churn.toFixed(1)}%).`,ci?`Customers with "${ci[0]}" tickets churn most (${ci[1].toFixed(1)}%).`:"",ar?`${ar[0]} subscribers earn the highest ARPU (৳${Math.round(ar[1])}).`:"",`Collections at ${KF.collect().toFixed(1)}%; ৳${f(KF.overdue())} overdue (${KF.bad().toFixed(1)}% bad debt).`]};
const ent=x=>{const g=G(x.tb,x.g);let e=Object.entries(g).filter(([k])=>k!==x.skip).map(([k,s])=>[k,sf(MS[x.m],s)]);if(x.g=="M"){const o=Object.fromEntries(e);e=MK.map(k=>[k,o[k]||0])}else if(x.g=="Aging"){const od=["1-30d","31-60d","61-90d","90d+"],o=Object.fromEntries(e);e=od.map(k=>[k,o[k]||0])}else e.sort((a,b)=>b[1]-a[1]);return x.top?e.slice(0,x.top):e};
const kp=(a,i)=>`<div class="kp" style="--c:${[Y,O,R][i%3]}"><span>${a[1]}</span><b>${a[2]||""}${f(KF[a[0]]())}${a[3]||""}</b></div>`;
const card=(t,b,w=4)=>`<div class="cd" style="grid-column:span ${w}"><h3>${t}</h3>${b}</div>`;
const pnl=x=>{const c=CL[x.c];let b;if(x.v=="gauge")b=gaugeC(+KF[x.k]().toFixed(1));else if(x.v=="mixd"){const s=S(x.tb);b=donutC(Object.fromEntries(x.parts.map(([l,k])=>[l,s[k]||0])))}else if(x.v=="heat")b=heatC();
else if(x.v=="dual")b=dualC(ent({...x,m:x.m}),ent({...x,m:x.m2}));else{const e=ent(x);b=x.v=="col"?colC(e,c,x.g):x.v=="line"?lineC(e,c):x.v=="bars"?barsC(e,c,x.g):donutC(Object.fromEntries(e.filter(z=>z[1]>0)),x.g)}return card(x.t,b,x.w)};
const chips=(d,vs)=>vs.map(v=>`<button class="${isSel(d,v)?"on":""}" ${at(d,v)}>${v}</button>`).join("");
const fb=()=>{const op=i=>MK.map((m,j)=>`<option value="${j}" ${j==i?"selected":""}>${m}</option>`).join(""),ex=Object.keys(F).filter(d=>!["Division","Network","Segment"].includes(d)&&F[d].size).flatMap(d=>[...F[d]].map(v=>`<button class="pill" ${at(d,v)}>${d}: ${v} ✕</button>`)).join("");
return`<div class="fb"><div><label>Division</label>${chips("Division",D.div.map(x=>x.n))}</div><div><label>Network</label>${chips("Network",["3G","4G","5G"])}</div><div><label>Segment</label>${chips("Segment",["Prepaid","Postpaid"])}</div><div><label>Months</label><select id="mf" onchange="mr()">${op(MR[0])}</select> → <select id="mt" onchange="mr()">${op(MR[1])}</select></div>${ex?`<div>${ex}</div>`:""}<button class="clr" onclick="clr()">Reset filters</button></div>`};
const home=()=>{const dv=DV();return`<header><div><h2>Command Center</h2><div class="sub">NexTel Communications · Bangladesh · 8 divisions · ${MK[MR[0]]} to ${MK[MR[1]]}</div></div><span class="pill0">SYNTHETIC DATA</span></header>${fb()}
<div class="k">${[["subs","Subscribers"],["active","Active"],["churn","Churn","","%"],["arpu","ARPU/mo","৳"],["nps","NPS"],["drop","Call drop","","%"],["avail","Availability","","%"],["collect","Collections","","%"]].map(kp).join("")}</div>
<div class="g">${card("Division density map",mapH(dv),8)}${card("Network & customer health",ringsC([["Collections",+KF.collect().toFixed(1),Y],["Availability",+KF.avail().toFixed(1),O],["FCR",+KF.fcr().toFixed(1),R],["SLA met",+KF.sla().toFixed(1),"#c4891a"],["Retention",+(100-KF.churn()).toFixed(1),"#ff9e57"]]),4)}</div>
<div class="g">${pnl({t:"Service revenue (৳ M)",v:"col",c:"y",w:4,tb:"usage",g:"M",m:"rev"})}${pnl({t:"Gross adds vs churned",v:"dual",c:"o",w:4,tb:"ev",g:"M",m:"ga",m2:"chm"})}${pnl({t:"Revenue mix",v:"mixd",c:"o",w:4,tb:"usage",parts:[["Data","dr"],["Voice","vr"],["SMS","sr"],["VAS","vs"]]})}</div>
<div class="g">${card("Division scorecard",tbl(dv),8)}${card("Live insights",INS(dv).filter(Boolean).map(x=>`<div class="ins">${x}</div>`).join(""),4)}</div><div class="ft">Synthetic dataset for portfolio use. Division area/population approximate (2022 census) - verify before publishing.</div>`};
const pg=g=>g.id=="home"?home():`<header><div><h2>${g.t}</h2><div class="sub">${g.sub}</div></div><span class="pill0">NEXTEL · BANGLADESH</span></header>${fb()}<div class="k">${g.kpis.map(kp).join("")}</div><div class="g">${g.panels.map(pnl).join("")}</div>`;
function draw(an){const m=document.getElementById("m");m.className=an?"":"noanim";m.innerHTML=pg(D.pages[cur]);document.querySelectorAll("nav button").forEach((b,j)=>b.classList.toggle("on",j==cur))}
function go(i){cur=i;draw(1);scrollTo(0,0)}
function mr(){let a=+document.getElementById("mf").value,b=+document.getElementById("mt").value;MR=[Math.min(a,b),Math.max(a,b)];draw()}
function clr(){F={};MR=[0,MK.length-1];draw()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-d]");if(!t)return;const d=t.dataset.d,v=decodeURIComponent(t.dataset.v);
if(d=="M"){const i=+v;MR=MR[0]==i&&MR[1]==i?[0,MK.length-1]:[i,i]}else if(d=="MAPM")cm=+v;else{F[d]=F[d]||new Set();F[d].has(v)?F[d].delete(v):F[d].add(v)}draw()});
document.getElementById("nv").innerHTML=D.pages.map((g,i)=>`<button onclick="go(${i})"><i>${g.ic}</i>${g.t}</button>`).join("");go(0);
</script></body></html>
